t-size="23" fill="#59675e" font-weight="400" text-anchor="start">Save once; return reference</text><text x="64" y="558" font-size="18" fill="#59675e" font-weight="600" text-anchor="start">HOTEL REQUEST</text><rect x="64" y="588" width="450" height="215" rx="20" fill="#e4eee7" stroke="#cdd7d0" stroke-width="2"/><text x="90" y="624" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">AGENT</text><text x="90" y="664" font-size="28" fill="#20392f" font-weight="600" text-anchor="start">Look up + draft</text><text x="90" y="703" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Read this guest’s booking</text><text x="90" y="735" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Prepare a policy-grounded note</text><path d="M514 695 H564" fill="none" stroke="#7b9083" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="574" y="588" width="450" height="215" rx="20" fill="#fff1d9" stroke="#cdd7d0" stroke-width="2"/><text x="600" y="624" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">GUEST</text><text x="600" y="664" font-size="28" fill="#20392f" font-weight="600" text-anchor="start">Review + send</text><text x="600" y="703" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Show the exact request</text><text x="600" y="735" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Explicit Send request click</text><path d="M1024 695 H1074" fill="none" stroke="#7b9083" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1084" y="588" width="450" height="215" rx="20" fill="#e8f0fc" stroke="#cdd7d0" stroke-width="2"/><text x="1110" y="624" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">APPLICATION</text><text x="1110" y="664" font-size="28" fill="#20392f" font-weight="600" text-anchor="start">Pending hotel review</text><text x="1110" y="703" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Validate ownership and expiry</text><text x="1110" y="735" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Mark pending once</text><rect x="64" y="863" width="1470" height="120" rx="20" fill="#ffffff" stroke="#cdd7d0" stroke-width="2"/><text x="90" y="904" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">AUTHORIZATION BOUNDARY</text><text x="90" y="944" font-size="24" fill="#20392f" font-weight="400" text-anchor="start">A booking reference is not authentication. Every lookup and write also requires the owning guest session.</text><text x="64" y="1023" font-size="20" fill="#59675e" font-weight="400" text-anchor="start">Fictional reservations only. No payments, booking changes, service approval or external staff notifications.</text></g></svg>