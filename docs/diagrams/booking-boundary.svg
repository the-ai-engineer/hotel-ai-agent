<text x="64" y="130" font-size="48" fill="#20392f" font-weight="600" text-anchor="start">Advice becomes action only after confirmation</text>
<text x="64" y="174" font-size="24" fill="#59675e" font-weight="400" text-anchor="start">The model proposes; application code authorizes and commits</text>
