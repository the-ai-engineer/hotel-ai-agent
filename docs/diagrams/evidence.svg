<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto;display:block">
<title id="title">The agent selects evidence. Tools return facts.</title><desc id="desc">A small reviewed catalogue, complete policy bodies and deterministic availability</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7b9083" stroke-width="2"/></marker></defs>
<rect width="1600" height="1000" fill="#f8f7f2"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="64" y="64" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">SANCTUARY HOTEL / SYSTEM DESIGN</text>
<text x="64" y="130" font-size="48" fill="#20392f" font-weight="600" text-anchor="start">The agent selects evidence. Tools return facts.</text>
<text x="64" y="174" font-size="24" fill="#59675e" font-weight="400" text-anchor="start">A small reviewed catalogue, complete policy bodies and deterministic availability</text>
<rect x="64" y="280" width="310" height="215" rx="20" fill="#ffffff" stroke="#cdd7d0" stroke-width="2"/><text x="90" y="316" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">SOURCE PACK</text><text x="90" y="356" font-size="28" fill="#20392f" font-weight="600" text-anchor="start">Hotel documents</text><text x="90" y="395" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Markdown + metadata</text><text x="90" y="427" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Stored in PostgreSQL</text><rect x="454" y="280" width="310" height="215" rx="20" fill="#e4eee7" stroke="#cdd7d0" stroke-width="2"/><text x="480" y="316" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">DISCOVERY</text><text x="480" y="356" font-size="28" fill="#20392f" font-weight="600" text-anchor="start">List documents</text><text x="480" y="395" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">IDs · titles · summaries</text><text x="480" y="427" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Keywords · revisions</text><rect x="844" y="280" width="310" height="215" rx="20" fill="#e8f0fc" stroke="#cdd7d0" stroke-width="2"/><text x="870" y="316" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">EVIDENCE</text><text x="870" y="356" font-size="28" fill="#20392f" font-weight="600" text-anchor="start">Read document</text><text x="870" y="395" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Complete published body</text><text x="870" y="427" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Exact listed revision</text><rect x="1234" y="280" width="310" height="215" rx="20" fill="#ffffff" stroke="#cdd7d0" stroke-width="2"/><text x="1260" y="316" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">GUEST ANSWER</text><text x="1260" y="356" font-size="28" fill="#20392f" font-weight="600" text-anchor="start">Explain + cite</text><text x="1260" y="395" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Facts from read evidence</text><text x="1260" y="427" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Versioned source link</text><path d="M374 385 H454" fill="none" stroke="#7b9083" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M764 385 H844" fill="none" stroke="#7b9083" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1154 385 H1234" fill="none" stroke="#7b9083" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="382" y="355" font-size="18" fill="#59675e" font-weight="500" text-anchor="start">Import</text><text x="770" y="355" font-size="18" fill="#59675e" font-weight="500" text-anchor="start">Select</text><text x="1160" y="355" font-size="18" fill="#59675e" font-weight="500" text-anchor="start">Use</text><rect x="64" y="575" width="450" height="230" rx="20" fill="#e8f0fc" stroke="#cdd7d0" stroke-width="2"/><text x="90" y="611" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">STRUCTURED HOTEL DATA</text><text x="90" y="651" font-size="28" fill="#20392f" font-weight="600" text-anchor="start">Villa facts + inventory</text><text x="90" y="690" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Capacity · bedding · amenities</text><text x="90" y="722" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Every night in the requested stay</text><text x="90" y="754" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Blocking bookings + closed nights</text><rect x="634" y="575" width="450" height="230" rx="20" fill="#e4eee7" stroke="#cdd7d0" stroke-width="2"/><text x="660" y="611" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">DETERMINISTIC TOOLS</text><text x="660" y="651" font-size="28" fill="#20392f" font-weight="600" text-anchor="start">Villa + availability tools</text><text x="660" y="690" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">get_villa / check_availability</text><text x="660" y="722" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Validate dates and guest count</text><text x="660" y="754" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Return approved cards, not HTML</text><path d="M514 690 H634" fill="none" stroke="#7b9083" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1084 690 H1390 V495" fill="none" stroke="#7b9083" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1130" y="670" font-size="18" fill="#59675e" font-weight="500" text-anchor="start">Validated facts</text><rect x="64" y="860" width="1480" height="84" rx="20" fill="#fff1d9" stroke="#cdd7d0" stroke-width="2"/><text x="90" y="913" font-size="25" fill="#20392f" font-weight="400" text-anchor="start">Summaries help selection. Only full bodies and successful villa-tool results support factual answers.</text><text x="64" y="980" font-size="20" fill="#59675e" font-weight="400" text-anchor="start">No vector index in this version. A future hotel wiki can feed the same reviewed import boundary.</text></g></svg>