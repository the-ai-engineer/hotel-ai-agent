<rect width="1600" height="980" fill="#f8f7f2"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="64" y="64" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">SANCTUARY HOTEL / SYSTEM DESIGN</text>
<text x="64" y="130" font-size="48" fill="#20392f" font-weight="600" text-anchor="start">A guest question, from request to saved answer</text>
<text x="64" y="174" font-size="24" fill="#59675e" font-weight="400" text-anchor="start">Request-local agent state • PostgreSQL owns completed conversation history</text>
<rect x="64" y="265" width="430" height="215" rx="20" fill="#ffffff" stroke="#cdd7d0" stroke-width="2"/><text x="90" y="301" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">01</text><text x="90" y="341" font-size="28" fill="#20392f" font-weight="600" text-anchor="start">Receive</text><text x="90" y="380" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Session cookie +</text><text x="90" y="412" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">guest question</text><path d="M494 375 H554" fill="none" stroke="#7b9083" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="564" y="265" width="430" height="215" rx="20" fill="#ffffff" stroke="#cdd7d0" stroke-width="2"/><text x="590" y="301" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">02</text><text x="590" y="341" font-size="28" fill="#20392f" font-weight="600" text-anchor="start">Authorize</text><text x="590" y="380" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Check ownership;</text><text x="590" y="412" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">admit one active turn</text><path d="M994 375 H1054" fill="none" stroke="#7b9083" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1064" y="265" width="430" height="215" rx="20" fill="#e8f0fc" stroke="#cdd7d0" stroke-width="2"/><text x="1090" y="301" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">03</text><text x="1090" y="341" font-size="28" fill="#20392f" font-weight="600" text-anchor="start">Load context</text><text x="1090" y="380" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Read bounded</text><text x="1090" y="412" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">completed history</text><rect x="64" y="555" width="430" height="215" rx="20" fill="#ffffff" stroke="#cdd7d0" stroke-width="2"/><text x="90" y="591" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">04</text><text x="90" y="631" font-size="28" fill="#20392f" font-weight="600" text-anchor="start">Run the agent</text><text x="90" y="670" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Gemini chooses tools;</text><text x="90" y="702" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">stream provisional text</text><path d="M494 665 H554" fill="none" stroke="#7b9083" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="564" y="555" width="430" height="215" rx="20" fill="#e8f0fc" stroke="#cdd7d0" stroke-width="2"/><text x="590" y="591" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">05</text><text x="590" y="631" font-size="28" fill="#20392f" font-weight="600" text-anchor="start">Save the result</text><text x="590" y="670" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Commit answer,</text><text x="590" y="702" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">sources and cards</text><path d="M994 665 H1054" fill="none" stroke="#7b9083" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1064" y="555" width="430" height="215" rx="20" fill="#ffffff" stroke="#cdd7d0" stroke-width="2"/><text x="1090" y="591" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">06</text><text x="1090" y="631" font-size="28" fill="#20392f" font-weight="600" text-anchor="start">Finish</text><text x="1090" y="670" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">Send result + done;</text><text x="1090" y="702" font-size="23" fill="#59675e" font-weight="400" text-anchor="start">refresh reads saved state</text><path d="M1494 480 V520 H279 V555" fill="none" stroke="#7b9083" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="680" y="510" font-size="18" fill="#59675e" font-weight="500" text-anchor="start">Continue the same request</text><rect x="64" y="830" width="1466" height="88" rx="20" fill="#e4eee7" stroke="#cdd7d0" stroke-width="2"/><text x="90" y="870" font-size="16" fill="#59675e" font-weight="600" text-anchor="start">STATE RULE</text><text x="290" y="887" font-size="25" fill="#20392f" font-weight="400" text-anchor="start">No shared mutable history. Release DB connections while waiting on Gemini.</text><text x="64" y="957" font-size="20" fill="#59675e" font-weight="400" text-anchor="start">Target admission and recovery rules; shared budgets and full crash recovery remain planned.</text></g></svg>