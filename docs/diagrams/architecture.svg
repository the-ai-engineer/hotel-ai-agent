<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Sanctuary Hotel AI concierge architecture</title><desc id="desc">Browser sends HTTP questions and receives SSE answers from one Cloud Run service containing static frontend, FastAPI and ADK. The agent uses Gemini on Vertex AI and read-only hotel tools backed by Cloud SQL. Sessions also persist in Cloud SQL. Secret Manager and Cloud observability support the service.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#62857a" stroke-width="1.7"/></marker></defs><rect width="1920" height="1080" fill="#f7f8f5"/>
<text x="72" y="66" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#687e74" font-weight="700">SANCTUARY HOTEL  /  GOOGLE CLOUD TUTORIAL</text>
<text x="72" y="132" font-family="Arial, Helvetica, sans-serif" font-size="46" fill="#193b30" font-weight="700">A website concierge, deployed as one application</text>
<text x="72" y="179" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#596e64" font-weight="400">Published policies. Villa information. Read-only availability. Persistent conversations.</text>
