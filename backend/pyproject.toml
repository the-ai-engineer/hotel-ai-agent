[project]
name = "hotel-ai-agent"
version = "0.1.0"
description = "Sanctuary Hotel guest concierge"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "google-adk>=1,<3", "sqlalchemy[asyncio]>=2,<3", "asyncpg>=0.30,<1",
  "alembic>=1.14,<2", "pydantic-settings>=2,<3", "jinja2>=3,<4",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
