[project]
name = "hotel-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["google-adk>=2.9.2,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "asyncpg>=0.30,<1", "anyio>=4,<5", "pydantic-settings>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
